# gitleaks config for trust-but-verify.
#
# IMPORTANT: this EXTENDS the built-in default ruleset (useDefault = true) — all
# of gitleaks' standard secret detection stays fully active. The only purpose of
# this file is to give confirmed false positives a narrow, reviewable home, so
# nobody reaches for `git commit --no-verify` and disables the scan entirely.
#
# Added 2026-09-02 alongside a local `.git/hooks/pre-commit` running
# `gitleaks protect --staged --redact --no-banner`, per the 2026-09-01 portfolio
# review: secret scanning was configured in 1 repo out of 12, and that one repo
# only got it after a live prod key was found committed.
#
# Install the matching hook in a fresh clone:
#   printf '%s\n' '#!/bin/sh' 'exec gitleaks protect --staged --redact --no-banner' \
#     > .git/hooks/pre-commit && chmod +x .git/hooks/pre-commit

[extend]
useDefault = true

# --- allowlists ----------------------------------------------------------
# Add entries here as confirmed false positives appear. Prefer an exact regex
# for the specific literal over a path glob: a path glob stops catching real
# secrets in that entire directory, which is how a fixture allowlist quietly
# becomes a hole. Worked examples: ~/Claude/OSINT/.gitleaks.toml
